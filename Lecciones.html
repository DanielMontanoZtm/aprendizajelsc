<!-- Menú móvil lateral -->
<div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
<nav class="mobile-menu" id="mobileMenu">

        </a>
    </div>
</nav>
<script>

document.addEventListener('DOMContentLoaded', function() {
    const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
    const mobileMenuClose = document.querySelector('.mobile-menu-close');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
    
    mobileMenuBtn.addEventListener('click', function() {
        mobileMenu.classList.add('active');
        mobileMenuOverlay.classList.add('active');
        document.body.style.overflow = 'hidden'; // Evitar scroll
    });
    
    function closeMobileMenu() {
        mobileMenu.classList.remove('active');
        mobileMenuOverlay.classList.remove('active');
        document.body.style.overflow = ''; // Restaurar scroll
    }
    
    mobileMenuClose.addEventListener('click', closeMobileMenu);
    mobileMenuOverlay.addEventListener('click', closeMobileMenu);
    
    document.querySelectorAll('.mobile-menu-item').forEach(item => {
        item.addEventListener('click', closeMobileMenu);
    });
});
</script>

    <script src="javascript.js" defer></script> 

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const popup = document.getElementById("popupProceso");
            const closeBtn = document.querySelector(".popup-close");
        
            // Íconos de las lecciones en proceso
            const bloqueados = document.querySelectorAll(
                'a[href="#leccion4"], a[href="#leccion5"], a[href="#leccion6"]'
            );
        
            bloqueados.forEach(item => {
                item.addEventListener("click", function(e) {
                    e.preventDefault(); // Evita que salte a la sección inexistente
                    popup.style.display = "flex"; // Muestra el popup
                });
            });
        
            closeBtn.addEventListener("click", function() {
                popup.style.display = "none";
            });
        
            // Cerrar al hacer clic fuera de la caja
            popup.addEventListener("click", function(e) {
                if (e.target === popup) {
                    popup.style.display = "none";
                }
            });
        });
        </script>
